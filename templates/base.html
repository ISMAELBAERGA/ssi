<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión IT & Cámaras</title>
    <!-- Bootstrap CSS para diseño limpio y rápido -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🔧 Gestión Servicios IT</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/clientes">📁 Clientes</a>
                <a class="nav-link" href="/hoja-servicio">📝 Nueva Hoja de Servicio</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Espacio para mensajes de alerta (Éxito o Error) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}
        <!-- Aquí se inyectará el contenido de los otros formularios -->
        {% endblock %}
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
