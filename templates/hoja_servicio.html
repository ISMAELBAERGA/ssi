{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white p-3">
                <h5 class="card-title mb-0">📝 Nueva Hoja de Servicio Técnico</h5>
            </div>
            <div class="card-body p-4">
                <form action="/hoja-servicio/nueva" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleccionar Cliente</label>
                        <select name="cliente_id" class="form-select" required>
                            <option value="">-- Elige un negocio registrado --</option>
                            {% for cliente in lista_clientes %}
                                <option value="{{ cliente[0] }}">{{ cliente[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Fecha del Servicio</label>
                            <input type="date" name="fecha_servicio" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tipo de Infraestructura</label>
                            <select name="tipo_servicio" class="form-select" required>
                                <option value="Mantenimiento Cámaras">Mantenimiento Cámaras</option>
                                <option value="Infraestructura Redes">Infraestructura Redes de Data</option>
                                <option value="Soporte IT Oficina">Soporte IT Oficina / Negocio</option>
                                <option value="Otro">Otro Servicio</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Técnico Asignado</label>
                        <input type="text" name="tecnico_asignado" class="form-control" placeholder="Tu nombre o el del técnico encargado">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción Detallada del Trabajo</label>
                        <textarea name="descripcion_trabajo" class="form-control" rows="4" required placeholder="Ej: Se reorientaron 3 cámaras exteriores, revisión de conectores RJ45..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Materiales / Repuestos Utilizados</label>
                        <textarea name="materiales_usados" class="form-control" rows="2" placeholder="Ej: 3 conectores RJ45 Cat6, 10 metros de cable UTP..."></textarea>
                    </div>

                    <div class="form-check p-3 bg-light rounded mb-4 border">
                        <input class="form-check-input ms-0 me-2" type="checkbox" name="enviar_correo" id="enviar_correo" checked>
                        <label class="form-check-label fw-bold text-success" for="enviar_correo">
                            Enviar copia de esta hoja por correo electrónico al cliente de inmediato
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold shadow-sm">Guardar y Procesar Servicio</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
